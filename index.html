<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preload" as='style' href="./assets/css/style.min.css" onload="this.onload=null;this.rel='stylesheet'">

  <title>Frontend Mentor | Browser extensions manager UI</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo"></div>
    <button class="mode">
      <img src="./assets/images/icon-sun.svg" alt="icon">
    </button>
  </header>

  <div class="filter">
    <h1>Extentions List</h1>
    <div class="filters">
      <button data-state="all" class="active">All</button>
      <button data-state="active">Active</button>
      <button data-state="inactive">Inactive</button>
    </div>
  </div>

  <div class="extentions">

  </div>


  <script src="assets/js/main.js"></script>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">omar matar</a>.
  </div>
</body>

</html>
